#=======================================#
# Basics
#=======================================#
baseURL: https://pgsty.com/
title: PGSTY — PostgreSQL in Great STYle
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: false
hasCJKLanguage: true

#=======================================#
# Services
#=======================================#
services:
  googleAnalytics:
    id: G-JLB25NYKJX

#=======================================#
# Hugo Module
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.160.1"
  imports:
    - path: github.com/pgsty/oink
      disable: false

#=======================================#
# Languages and navigation
#=======================================#
languages:
  en:
    label: English
    locale: en
    weight: 1
    title: PGSTY
    params:
      description: The company behind Pigsty — open-source PostgreSQL distribution, tooling, and enterprise services.
      time_format_blog: 'January 02, 2006'
      ui:
        command_palette:
          commands:
            - id: product_docs
              title: Open Pigsty documentation
              description: Installation, operations, and reference guides
              url: https://pigsty.io/docs/
              icon: fa-solid fa-book
              keywords: [docs, guide, install, operations]
            - id: contact_pgsty
              title: Contact PGSTY
              description: Talk directly to the author and maintainer
              url: /#contact
              icon: fa-solid fa-envelope
              keywords: [support, service, email, help]
