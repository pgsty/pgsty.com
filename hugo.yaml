#=======================================#
# Basics
#=======================================#
baseURL: https://pgsty.com/
title: PGSTY — PostgreSQL in Great STYle
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: false
hasCJKLanguage: true

#=======================================#
# Hugo Module
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.155.0"
  imports:
    - path: github.com/google/docsy
      disable: false

#=======================================#
# Languages and navigation
#=======================================#
languages:
  en:
    label: English
    locale: en
    weight: 1
    title: PGSTY
    params:
      description: The company behind Pigsty — open-source PostgreSQL distribution, tooling, and enterprise services.
      time_format_blog: 'January 02, 2006'
    menu:
      main:
        - identifier: product
          name: Product
          weight: 10
          url: /#postgres
        - identifier: services
          name: Services
          weight: 20
          url: /#service
        - identifier: pricing
          name: Pricing
          weight: 30
          url: /price/
        - identifier: values
          name: Values
          weight: 35
          url: /#yours
        - identifier: about
          name: About
          weight: 40
          url: /#about
        - identifier: github
          name: GitHub
          weight: 50
          url: https://github.com/pgsty
          pre: <i class='fa-brands fa-github'></i>
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: PGSTY
    params:
      description: Pigsty 背后的公司 —— 开源 PostgreSQL 发行版、工具链与企业级专业服务。
      time_format_blog: '2006年01月02日'
    menu:
      main:
        - identifier: product
          name: 产品
          weight: 10
          url: /zh/#postgres
        - identifier: services
          name: 服务
          weight: 20
          url: /zh/#service
        - identifier: pricing
          name: 价格
          weight: 30
          url: /zh/price/
        - identifier: values
          name: 理念
          weight: 35
          url: /zh/#yours
        - identifier: about
          name: 关于
          weight: 40
          url: /zh/#about
        - identifier: github
          name: GitHub
          weight: 50
          url: https://github.com/pgsty
          pre: <i class='fa-brands fa-github'></i>

#=======================================#
# Taxonomies and blog URLs
#=======================================#
# 门户站不需要分类/标签页（空壳页会带出文档链的死链）
disableKinds: [taxonomy, term]

permalinks:
  blog: '/:sections/:contentbasename/'

#=======================================#
# Markdown and syntax highlighting
#=======================================#
markup:
  goldmark:
    parser:
      attribute:
        block: true
      autoHeadingID: true
      autoHeadingIDType: github
    renderer:
      unsafe: true
    extensions:
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
  highlight:
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

#=======================================#
# Outputs
#=======================================#
outputs:
  home: [HTML, RSS, JSON]
  page: [HTML]
  section: [HTML, RSS]

#=======================================#
# Site parameters
#=======================================#
params:
  description: The company behind Pigsty — open-source PostgreSQL distribution, tooling, and enterprise services.
  images:
    - img/pgsty-social-card.png
  version: 0.1.0
  copyright:
    authors: PGSTY PTE. LTD.
    from_year: 2018
    url: https://pgsty.com

  # 正文列宽模式：normal（1050px，默认）| wide（1300px）| full（占满可用宽）。
  page_width: normal
  # ICP 备案号（单行页脚居中显示，链接到 beian.miit.gov.cn；留空则不渲染）。
  footer_icp: ""

  archived_version: false
  url_latest_version: https://pgsty.com
  github_repo: https://github.com/pgsty/pgsty.com
  github_branch: main

  # 站内搜索沿用项目自有实现；关闭 Docsy offlineSearch（详见 silo 上游注释）。
  offlineSearch: false
  prism_syntax_highlighting: false

  ui:
    breadcrumb_disable: false
    navbar_logo: true
    navbar_translucent_over_cover_disable: false
    navbar_theme: dark
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_cache_limit: 1000
    sidebar_root_enabled: true
    ul_show: 2
    showLightDarkModeMenu: true
    scrollSpy:
      disable: true
    sidebar_root_menu: true
    sidebar_width_min: 220
    sidebar_width_max: 480
    sidebar_item_overflow: ellipsis
    feedback:
      enable: false
    readingtime:
      enable: false

  links:
    user:
      - name: Pigsty
        url: https://pigsty.io
        icon: fa fa-database
        desc: Battery-included PostgreSQL distribution
      - name: GitHub
        url: https://github.com/pgsty
        icon: fab fa-github
        desc: PGSTY open-source organization
    developer:
      - name: Pigsty Repo
        url: https://github.com/pgsty/pigsty
        icon: fab fa-github
        desc: Pigsty source repository
      - name: Portal Source
        url: https://github.com/pgsty/pgsty.com
        icon: fab fa-github
        desc: This website's repository
