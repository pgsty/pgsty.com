#=======================================#
# Basics
#=======================================#
baseURL: https://pgsty.com/
title: PGSTY — PostgreSQL in Great STYle
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: false
hasCJKLanguage: true

#=======================================#
# Services
#=======================================#
services:
  googleAnalytics:
    id: G-JLB25NYKJX

#=======================================#
# Hugo Module
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.160.1"
  imports:
    - path: github.com/pgsty/oink
      disable: false

#=======================================#
# Languages and navigation
#=======================================#
languages:
  en:
    label: English
    locale: en
    weight: 1
    title: PGSTY
    params:
      description: The company behind Pigsty — open-source PostgreSQL distribution, tooling, and enterprise services.
      time_format_blog: 'January 02, 2006'
      ui:
        command_palette:
          commands:
            - id: product_docs
              title: Open Pigsty documentation
              description: Installation, operations, and reference guides
              url: https://pigsty.io/docs/
              icon: fa-solid fa-book
              keywords: [docs, guide, install, operations]
            - id: contact_pgsty
              title: Contact PGSTY
              description: Talk directly to the author and maintainer
              url: /#contact
              icon: fa-solid fa-envelope
              keywords: [support, service, email, help]
    menu:
      main:
        - identifier: product
          name: Product
          weight: 10
          url: /#postgres
        - identifier: solutions
          name: Solutions
          weight: 15
          pageRef: /solutions
        - identifier: services
          name: Services
          weight: 20
          url: /#service
        - identifier: pricing
          name: Pricing
          weight: 30
          pageRef: /price
        - identifier: values
          name: Values
          weight: 35
          url: /#yours
        - identifier: about
          name: About
          weight: 40
          pageRef: /about
        - identifier: github
          name: GitHub
          weight: 50
          url: https://github.com/pgsty
          pre: <i class='fa-brands fa-github'></i>
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: PGSTY
    params:
      description: Pigsty 背后的公司 —— 开源 PostgreSQL 发行版、工具链与企业级专业服务。
      time_format_blog: '2006年01月02日'
      ui:
        command_palette:
          commands:
            - id: product_docs
              title: 打开 Pigsty 文档
              description: 安装、运维与参考指南
              url: https://pigsty.cc/docs/
              icon: fa-solid fa-book
              keywords: [文档, 指南, 安装, 运维]
            - id: contact_pgsty
              title: 联系 PGSTY
              description: 直接联系作者与维护者
              url: /#contact
              icon: fa-solid fa-envelope
              keywords: [支持, 服务, 邮件, 咨询]
    menu:
      main:
        - identifier: product
          name: 产品
          weight: 10
          url: /zh/#postgres
        - identifier: solutions
          name: 解决方案
          weight: 15
          pageRef: /solutions
        - identifier: services
          name: 服务
          weight: 20
          url: /zh/#service
        - identifier: pricing
          name: 价格
          weight: 30
          pageRef: /price
        - identifier: values
          name: 理念
          weight: 35
          url: /zh/#yours
        - identifier: about
          name: 关于
          weight: 40
          pageRef: /about
        - identifier: github
          name: GitHub
          weight: 50
          url: https://github.com/pgsty
          pre: <i class='fa-brands fa-github'></i>

#=======================================#
# Taxonomies and blog URLs
#=======================================#
# 门户站不需要分类/标签页（空壳页会带出文档链的死链）
disableKinds: [taxonomy, term]

permalinks:
  blog: '/:sections/:contentbasename/'

#=======================================#
# Markdown and syntax highlighting
#=======================================#
markup:
  goldmark:
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
      autoHeadingID: true
      autoHeadingIDType: github
    renderer:
      unsafe: true
    extensions:
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
  highlight:
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

#=======================================#
# Outputs
#=======================================#
outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, markdown]

#=======================================#
# Site parameters
#=======================================#
params:
  description: The company behind Pigsty — open-source PostgreSQL distribution, tooling, and enterprise services.
  images:
    - img/pgsty-social-card.png
  copyright:
    authors: PGSTY PTE. LTD.
    from_year: 2018
    url: https://pgsty.com

  # 正文列宽模式：normal（1050px，默认）| wide（1300px）| full（占满可用宽）。
  page_width: normal
  # ICP 备案号（单行页脚居中显示，链接到 beian.miit.gov.cn；留空则不渲染）。
  footer_icp: ""

  github_repo: https://github.com/pgsty/pgsty.com
  github_branch: main

  # OINK 为每种语言生成同源摘要索引，门户页通过 Command Palette 使用。
  offline_search: true
  offline_search_on_serve: true
  offline_search_index: summary
  offline_search_summary_length: 120
  offline_search_max_results: 10
  highlight_classes: true

  ui:
    breadcrumb: true
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_cache_limit: 1000
    sidebar_root_enabled: true
    sidebar_expand_levels: 2
    dark_mode: true
    quick_links: [solutions, pricing, about]
    page_context_menu:
      assistant_links: false
    scroll_spy: false
    sidebar_root_menu: true
    sidebar_width_min: 220
    sidebar_width_max: 480
    sidebar_item_overflow: ellipsis
    feedback:
      enable: false
    reading_time: false
