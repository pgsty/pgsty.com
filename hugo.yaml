#=======================================#
# Basics
#=======================================#
baseURL: https://pgsty.com/
title: PGSTY PTE. LTD. — Open-source Software & PostgreSQL Services
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: false
hasCJKLanguage: true

#=======================================#
# Services
#=======================================#
privacy:
  googleAnalytics:
    disable: true

#=======================================#
# Hugo Module
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.160.1"
  imports:
    - path: github.com/pgsty/oink
      disable: false

