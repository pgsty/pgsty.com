#=======================================#
# Taxonomies and blog URLs
#=======================================#
# 门户站不需要分类/标签页（空壳页会带出文档链的死链）
disableKinds: [taxonomy, term]

permalinks:
  blog: '/:sections/:contentbasename/'

#=======================================#
# Markdown and syntax highlighting
#=======================================#
markup:
  goldmark:
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
      autoHeadingID: true
      autoHeadingIDType: github
    renderer:
      unsafe: true
    extensions:
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
  highlight:
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

#=======================================#
# Outputs
#=======================================#
outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, markdown]

#=======================================#
# Site parameters
#=======================================#
params:
  description: PGSTY PTE. LTD. is a Singapore company building open-source PostgreSQL and data infrastructure software, with professional deployment, migration, and support services.
  images:
    - img/pgsty-social-card.png
  copyright:
    authors: PGSTY PTE. LTD.
    url: https://pgsty.com

  # 正文列宽模式：normal（1050px，默认）| wide（1300px）| full（占满可用宽）。
  page_width: normal
  # ICP 备案号（单行页脚居中显示，链接到 beian.miit.gov.cn；留空则不渲染）。
  footer_icp: ""

  github_repo: https://github.com/pgsty/pgsty.com
  github_branch: main

  # OINK 为每种语言生成同源摘要索引，门户页通过 Command Palette 使用。
  offline_search: true
  offline_search_on_serve: true
  offline_search_index: summary
  offline_search_summary_length: 120
  offline_search_max_results: 10
  highlight_classes: true

  ui:
    breadcrumb: true
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_cache_limit: 1000
    sidebar_root_enabled: true
    sidebar_expand_levels: 2
    dark_mode: true
    quick_links: [projects, resources, services, pricing, company]
    page_context_menu:
      assistant_links: false
    scroll_spy: false
    sidebar_root_menu: true
    sidebar_width_min: 220
    sidebar_width_max: 480
    sidebar_item_overflow: ellipsis
    feedback:
      enable: false
    reading_time: false
