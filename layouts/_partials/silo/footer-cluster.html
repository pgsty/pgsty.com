{{- /* fumadocs v16 底部组合件：一个描边底座内 [GitHub · 语言选择 | 分割线 | 太阳 月亮]。
       语言钮弹出选择框（快捷直切在右上角 actions 行）；
       主题钮自带的左边框即分割线；活跃图标由 CSS 依 html[data-bs-theme] 标记方形底。 */ -}}
<div class="silo-cluster">
  <a class="silo-cluster__btn" href="{{ .Site.Params.github_project_repo }}" target="_blank"
    rel="noopener noreferrer" title="GitHub" aria-label="GitHub">
    {{- partialCached "silo/icon.html" "github" "github" -}}
  </a>
  {{ partial "silo/lang-switch.html" . }}
  <button type="button" class="silo-cluster__theme" data-silo-theme-toggle
    title="{{ T "silo_theme_toggle" }}" aria-label="{{ T "silo_theme_toggle" }}">
    <span class="silo-cluster__opt" data-theme-opt="light">{{ partialCached "silo/icon.html" "sun" "sun" }}</span>
    <span class="silo-cluster__opt" data-theme-opt="dark">{{ partialCached "silo/icon.html" "moon" "moon" }}</span>
  </button>
</div>
