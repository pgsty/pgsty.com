# 公司首页常见问题；链接相对于当前语言。
sections:
  - type: faq
    key: buyer_faq

buyer_faq:
  eyebrow: 常见问题
  title: 与 PGSTY 合作
  desc: 了解我们的公司、软件与专业服务。
  items:
    - question: 本网站的服务由谁提供？
      answer: '本网站是新加坡 PGSTY PTE. LTD. 的公司官网。我们的业务聚焦 PostgreSQL 与开源基础设施软件。您可以[了解公司](about/)，或就具体项目[联系我们](contact/)。'
      open: true
    - question: 可以委托 PGSTY 做哪些工作？
      answer: '[专业服务](services/)覆盖架构设计与部署、数据库迁移、性能评审、技术支持、培训和定制工程。服务范围、交付物与费用在书面约定中明确。'
    - question: 购买服务前可以评估软件吗？
      answer: '可以。[项目目录](projects/)提供文档与公开源代码入口。各项目及其依赖分别适用自身许可证，包括 Apache-2.0 与 AGPL-3.0，使用时请遵守相应条款。'
    - question: 如何获取报价？
      answer: '[联系我们](contact/)并说明现有环境、目标与时间安排，我们将与您确认范围和商务细节。[页面定价](price/)可供初步参考，交付内容与支持承诺以书面协议为准。'
