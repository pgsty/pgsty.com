# Corporate homepage questions. Links are relative to the current language.
sections:
  - type: faq
    key: buyer_faq

buyer_faq:
  eyebrow: Common questions
  title: Working with PGSTY
  desc: Clear information about our company, software and professional services.
  items:
    - question: Who provides the services on this website?
      answer: >-
        This is the corporate website of PGSTY PTE. LTD., Singapore.
        Our work focuses on PostgreSQL and open-source infrastructure software.
        Read [about the company](about/) or [contact us](contact/) about a project.
      open: true
    - question: What can we engage PGSTY to do?
      answer: >-
        Our [professional services](services/) cover architecture and deployment,
        database migration, performance reviews, technical support, training
        and custom engineering. Scope, deliverables and fees are agreed in writing.
    - question: Can we evaluate the software before buying a service?
      answer: >-
        Yes. Our [project directory](projects/) links to documentation and public
        source repositories. Projects and their dependencies have their own
        licences, including Apache-2.0 and AGPL-3.0; use is subject to those terms.
    - question: How do we request a quotation?
      answer: >-
        [Contact us](contact/) with your environment, goals and timeline.
        We will confirm the scope and provide the commercial details.
        [Listed pricing](price/) is a starting point; the written agreement
        defines the deliverables and any support commitments.
