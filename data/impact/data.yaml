      en: "Full available account/day history. Both headline and chart count HTTP requests, including websites, software delivery, automation and errors. The separate page_views field is retained in the dataset but is not used for this chart. Host drilldown is a separate adaptive dataset over pigsty.io on recorded days only; never add these profiles together. Source dates describe actual recorded coverage. The last recorded day is partial; no extrapolation beyond the archive."
      zh: "完整可用账号/日历史。顶部数字和图表均统计 HTTP 请求，包含网站、软件分发、自动化与错误。独立的 page_views 字段保留在数据文件中，不用于此图。站点明细是 pigsty.io 独立自适应数据，仅覆盖已记录日，不能与账号总量相加。来源日期表示实际记录范围。末日不完整，不外推到归档之外。"
