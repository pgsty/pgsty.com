      zh: "全部 pgsty 公开镜像累计计数，含历史 pgsty/minio，包含重复与自动化拉取，不等于独立用户或安装实例。顶部下载与拉取为两个渠道计数的算术和，横向图将 Docker 仓库堆叠在同一渠道内，GitHub Release 保留一个总量。"
