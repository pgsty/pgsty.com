    url: "https://github.com/pgsty"
    note:
      en: "All current public repositories, including forks and archives. Cumulative history reconstructs Stars still retained at collection; removed Stars are unavailable. Repository history before PGSTY organization creation (2024-01-21) is included. This is current-portfolio history, not past organization membership or exact historical net stocks."
      zh: "涵盖当前全部公开仓库，含 Fork 与归档仓库。按采集时仍保留的 Star 时间重建累计历史，已取消的 Star 无法恢复。包含组织成立（2024-01-21）之前的项目历史；表示当前仓库组合的历史，不表示当时组织成员范围或历史净存量。"
