    url: "https://developers.google.com/analytics/devguides/reporting/data/v1/api-schema"
    note:
      en: "Hostname-filtered GA4 screenPageViews for all configured ecosystem domains, including founder content; not all sites belong to the company. Monthly PV sums daily PV. On overlapping migration days, retain the higher stream PV rather than summing both. Tracking start/end differs by site; missing months remain null. Repeat views and reported peaks are retained; PV is not unique people."
      zh: "全部已配置生态域名的 GA4 screenPageViews，含创始人内容站，并非均归公司所有。月度 PV 由每日 PV 汇总；迁移重叠日保留两个数据流中的较大 PV，不相加。各站采集起止不同，缺测月份为空。保留重复浏览与原始峰值，PV 不等于独立人数。"
