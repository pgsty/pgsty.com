# ============================================================
# 品牌字段与指标快照；数字经 hugo.Data.brand.* 引用，展示前核对时效。
# 公司身份事实 → data/company.yaml；当前首页口号 → layouts/index.html。
# 维护与检查说明见 AGENTS.md；历史 PRD 中的首页设计不再是当前要求。
# 相邻数据：订阅档位 → data/portal/pricing.yaml
#          按需服务 → data/portal/services.yaml
#          项目版本与星数 → data/portal/projects.yaml
# 星数刷新：bin/metrics.py update
# ============================================================

# 字标（wordmark）：解释缩写来历，不做当前 hero 标题
wordmark: PostgreSQL In Great STYle

# 历史价值主张（tagline）：保留字段，不作为当前 hero / OG / 页脚的默认来源
tagline: Production Grade. Self-hosted. Truly Yours.
tagline_zh: 生产级自建，产权归你          # 官网 / 合同 / 标书默认
tagline_zh_community: 生产级自建，谁也拿不走   # 社区 / 周边物料
tagline_zh_xinchuang: 生产级自建，主权在你     # 信创 / 政企场景（中文信创页）

metrics:
  github_stars: 5510        # github.com/pgsty/pigsty（bin/metrics.py update 回写）
  ext_catalogued: 2230      # PGEXT.CLOUD 收录扩展数
  ext_packaged: 572         # 已打包可安装扩展数 —— 对外唯一扩展数口径（PRD §10.1）
  kernels: 12               # 可替换 PG 内核数 —— pigsty.io 首页口径「12 PG kernel forks」（2026-08-06 核对）
  metrics_per_instance: 600 # pg_exporter 单实例指标数（600+）
  series_per_instance: 3000 # 单实例时间序列（约 3,000 条）
  since_year: 2018          # Pigsty 项目起始年份；公司成立日期见 company.yaml
  oss_since_year: 2020      # 开源起步年份（指标带「Open source since」用）
