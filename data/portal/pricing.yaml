# ------------------------------------------------------------
# 常见问题（/price 页）
# ------------------------------------------------------------
faq:
  - q: What does the commercial version offer?
    qZh: 商业版提供哪些服务？
    a: Subscriptions combine the package, platform coverage and technical support described in each plan. The signed agreement defines the licensed deliverables, support scope, response targets and any warranty or service-level commitments. Third-party software retains its own licence terms.
    aZh: 订阅包含各档位列出的软件包、平台覆盖与技术支持。具体许可交付物、支持范围、响应目标，以及任何质保或服务等级承诺，均由签署的协议确定。第三方软件仍适用自身许可证。
  - q: How are nodes counted?
    qZh: 节点数量是如何计算的？
    a: Node count refers to the number of distinct IP addresses managed by Pigsty.
    aZh: 节点数量指 Pigsty 纳入管理的独立 IP 地址数量。
  - q: Can I try before I buy?
    qZh: 可以先试用再购买吗？
    a: You can evaluate Pigsty using the open-source project and documentation. Contact us if you need an enterprise evaluation package; eligibility, duration and support scope will be confirmed in writing.
    aZh: 您可以通过开源项目与文档评估 Pigsty。如果需要企业评估软件包，请联系我们确认适用条件、期限与支持范围。
  - q: How do I get invoices and contracts?
    qZh: 如何获取发票和合同？
    a: PGSTY PTE. LTD., Singapore, provides a written quotation and agreement for the engagement. Confirm your legal entity name, billing details, currency and any applicable tax requirements before ordering.
    aZh: 本网站服务由新加坡 PGSTY PTE. LTD. 提供书面报价与服务协议。采购前请确认客户主体名称、账单信息、结算币种与适用税费要求。
  - q: What payment methods are supported?
    qZh: 支持哪些支付方式？
    a: The quotation or invoice specifies the available payment method, beneficiary, currency and due date. Please use the payment instructions issued for your engagement.
    aZh: 可用付款方式、收款方、币种与付款期限会在报价或账单中明确，请以对应项目提供的付款指引为准。
  - q: What if I need more nodes?
    qZh: 需要更多节点怎么办？
    a: Additional nodes and custom configurations can be discussed in your quotation. Contact us to confirm the revised scope and fee before expanding a subscription.
    aZh: 可以在报价时讨论额外节点与定制配置。扩展订阅前，请联系确认调整后的服务范围与费用。
