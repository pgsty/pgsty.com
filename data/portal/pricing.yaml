# ------------------------------------------------------------
# 常见问题（/price 页）
# ------------------------------------------------------------
faq:
  - q: What does the commercial version offer?
    qZh: 商业版提供哪些服务？
    a: Commercial subscriptions include a commercial license, warranty and bug-fix guarantees, custom offline packages, exclusive support from industry-leading experts for hard problems, response-time SLAs, and broader Linux / PostgreSQL version coverage.
    aZh: 商业版提供商业许可、质保与缺陷修复承诺、定制离线软件包、业界顶尖专家的疑难杂症兜底、响应时间 SLA，以及更宽广的 Linux 与 PostgreSQL 版本支持范围。
  - q: How are nodes counted?
    qZh: 节点数量是如何计算的？
    a: Node count refers to the number of distinct IP addresses managed by Pigsty.
    aZh: 节点数量指 Pigsty 纳入管理的独立 IP 地址数量。
  - q: Can I try before I buy?
    qZh: 可以先试用再购买吗？
    a: Absolutely — the open-source version is fully functional and identical in core capability, so evaluate as long as you like. We also offer a 30-day enterprise trial.
    aZh: 当然可以！开源版功能完整，与商业版核心能力一致，您可以充分评估后再决定。我们也提供 30 天企业评估试用。
  - q: How do I get invoices and contracts?
    qZh: 如何获取发票和合同？
    a: We provide standard invoices and business contracts. Contact rh@vonng.com for commercial details.
    aZh: 我们提供普通发票 / 增值税发票和标准商务合同，商务细节请联系 rh@vonng.com。
  - q: What payment methods are supported?
    qZh: 支持哪些支付方式？
    a: We accept wire transfer, PayPal, and major credit cards.
    aZh: 订阅服务支持对公转账；专家号与咨询支持支付宝、微信等多种支付方式。
  - q: What if I need more nodes?
    qZh: 需要更多节点怎么办？
    a: Additional nodes beyond your plan can be purchased separately, and Enterprise plans support custom configurations for your actual needs.
    aZh: 超出方案的节点可按需加购，企业版还支持根据实际需求定制方案，详情请联系商务。
