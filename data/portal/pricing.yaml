        nameZh: 再分发权限
        cells: ["Y", "N", "N", "Y"]
        cellsZh: ["Y", "N", "N", "Y"]
  - group: Scale limits
    groupZh: 规模限制
    rows:
      - name: Database nodes
        nameZh: 数据库节点数
        cells: ["Unlimited", "≤5", "≤15", "Reference: 50"]
        cellsZh: ["不限", "≤5", "≤15", "参考规模：50"]
      - name: PostgreSQL majors
        nameZh: PostgreSQL 版本
        cells: ["18 (14–18)", "16–18", "14–18", "13–18 · custom"]
        cellsZh: ["18（14–18 可选）", "16–18", "14–18", "13–18 · 按需定制"]
