- key: pigsty
  name: PIGSTY
  flagship: true
  repo: https://github.com/pgsty/pigsty
  site: https://pigsty.io/
  siteZh: https://pigsty.cc/
  version: v4.4.0
  license: Apache-2.0
  stars: 5510
  lang: Ansible
  kind: PG DISTRIBUTION
  kindZh: PG 发行版
  desc: Battery-included, local-first PostgreSQL distribution — a free & better RDS alternative. Self-healing HA, PITR, SOTA monitoring, and 572 ready-to-install extensions.
  descZh: 开箱即用、本地优先的 PostgreSQL 发行版 —— 免费且更好的 RDS 替代。自愈高可用、时间点恢复、顶级监控与 572 个即装即用的扩展。
  install: "curl -fsSL https://repo.pigsty.io/get | bash"
  installZh: "curl -fsSL https://repo.pigsty.cc/get | bash"

- key: pig
  name: PIG
  repo: https://github.com/pgsty/pig
  site: https://pig.pgsty.com/
  siteZh: https://pig.pgsty.com/zh/
  version: v1.6.1
  license: Apache-2.0
  stars: 199
  lang: Go
  kind: PACKAGE MANAGER
  kindZh: 包管理器
  desc: PostgreSQL & extension package manager — PG 14–18 with 572 extensions on EL / Debian / Ubuntu, amd64 & arm64, agent-friendly structured output.
  descZh: PostgreSQL 与扩展包管理器 —— PG 14–18 × 572 个扩展，覆盖 EL / Debian / Ubuntu 与双架构，Agent 友好的结构化输出。
  install: "curl -fsSL https://repo.pigsty.io/pig | bash"
  installZh: "curl -fsSL https://repo.pigsty.cc/pig | bash"

- key: pg_exporter
  name: PG_EXPORTER
  repo: https://github.com/pgsty/pg_exporter
  site: https://exp.pgsty.com/
  siteZh: https://exp.pgsty.com/zh/
  version: v1.4.1
  license: Apache-2.0
  stars: 358
  lang: Go
  kind: METRICS EXPORTER
  kindZh: 指标导出器
  desc: Advanced PostgreSQL & PgBouncer metrics exporter for Prometheus — 600+ metrics with declarative config and dynamic collector planning.
  descZh: 为 Prometheus 打造的 PostgreSQL / PgBouncer 指标导出器 —— 600+ 指标，声明式配置与动态采集规划。
  install: "docker pull pgsty/pg_exporter"
  installZh: "docker pull pgsty/pg_exporter"

- key: silo
  name: SILO
  repo: https://github.com/pgsty/minio
  site: https://silo.pgsty.com/
  siteZh: https://silo.pgsty.com/zh/
  version: RELEASE.2026-08-06
  license: AGPL-3.0
  stars: 2141
  lang: Go
  kind: OBJECT STORAGE
  kindZh: 对象存储
  desc: The MinIO fork maintained by PIGSTY — S3-compatible object storage with continued security updates, a restored console, and full release artifacts.
  descZh: PIGSTY 维护的 MinIO 分支 —— S3 兼容对象存储，持续安全更新、恢复的管理控制台与完整发行制品。
  install: "docker pull pgsty/minio"
  installZh: "docker pull pgsty/minio"

- key: sow
  name: SOW
  repo: https://github.com/pgsty/sow
  site: https://sow.pgsty.com/
  siteZh: https://sow.pgsty.com/zh/
  version: v0.3.0
  license: Apache-2.0
  stars: 1
  lang: Go
  kind: REPO MANAGER
  kindZh: 仓库管理器
  desc: Self-contained RPM / YUM and DEB / APT repository manager — one-command indexing, managed workspaces, immutable generations, and incremental publishing.
  descZh: 自包含的 RPM / YUM 与 DEB / APT 仓库管理器 —— 一条命令完成索引，并支持托管工作区、不可变代际与增量发布。
  install: "sow create ./packages"
  installZh: "sow create ./packages"

