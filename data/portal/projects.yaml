- key: barn
  name: Barn
  icon: fa-solid fa-server
  summary: Create local lightweight VMs for development and database testing.
  summaryZh: 面向本地轻量虚拟机集群，用于开发测试与数据库实验。
  repo: https://github.com/pgsty/barn
  site: https://barn.pgsty.com/
  siteZh: https://barn.pgsty.com/zh/
  version: v0.9.0
  license: Apache-2.0
  lang: Go
  kind: VIRTUAL MACHINES
  kindZh: 虚拟机工具
  desc: A local lightweight VM tool for macOS and Linux, building reproducible multi-node lab environments.
  descZh: 本地轻量虚拟机工具，快速拉起多节点测试集群。
  use: Spin up local lightweight VMs to test multi-node database clusters.
  useZh: 快速搭建本地轻量虚拟机，验证多节点数据库集群。
  install: "brew install pgsty/infra/barn"
  installZh: "brew install pgsty/infra/barn"
