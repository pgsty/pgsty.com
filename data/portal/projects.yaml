- key: pigsty
  name: PIGSTY
  flagship: true
  repo: https://github.com/pgsty/pigsty
  site: https://pigsty.io
  siteZh: https://pigsty.cc
  version: v4.4.0
  license: Apache-2.0
  stars: 5482
  lang: Ansible
  kind: PG DISTRIBUTION
  kindZh: PG 发行版
  desc: Battery-included, local-first PostgreSQL distribution — a free & better RDS alternative. Self-healing HA, PITR, SOTA monitoring, and 562 ready-to-install extensions.
  descZh: 开箱即用、本地优先的 PostgreSQL 发行版 —— 免费且更好的 RDS 替代。自愈高可用、时间点恢复、顶级监控与 562 个即装即用的扩展。
  install: "curl -fsSL https://repo.pigsty.io/get | bash"
  installZh: "curl -fsSL https://repo.pigsty.cc/get | bash"

- key: pig
  name: PIG
  repo: https://github.com/pgsty/pig
  site: https://pigsty.io/docs/pig
  siteZh: https://pigsty.cc/docs/pig
  version: v1.6.1
  license: Apache-2.0
  stars: 196
  lang: Go
  kind: PACKAGE MANAGER
  kindZh: 包管理器
  desc: PostgreSQL & extension package manager — PG 14–18 with 562 extensions on EL / Debian / Ubuntu, amd64 & arm64, agent-friendly structured output.
  descZh: PostgreSQL 与扩展包管理器 —— PG 14–18 × 562 个扩展，覆盖 EL / Debian / Ubuntu 与双架构，Agent 友好的结构化输出。
  install: "curl -fsSL https://repo.pigsty.io/pig | bash"
  installZh: "curl -fsSL https://repo.pigsty.cc/pig | bash"

- key: pg_exporter
  name: PG_EXPORTER
  repo: https://github.com/pgsty/pg_exporter
  site: https://pigsty.io/docs/pg_exporter
  siteZh: https://pigsty.cc/docs/pg_exporter
  version: v1.4.1
  license: Apache-2.0
  stars: 357
  lang: Go
  kind: METRICS EXPORTER
  kindZh: 指标导出器
  desc: Advanced PostgreSQL & PgBouncer metrics exporter for Prometheus — 600+ metrics with declarative config and dynamic collector planning.
  descZh: 为 Prometheus 打造的 PostgreSQL / PgBouncer 指标导出器 —— 600+ 指标，声明式配置与动态采集规划。
  install: "docker pull pgsty/pg_exporter"
  installZh: "docker pull pgsty/pg_exporter"

- key: silo
  name: SILO
  repo: https://github.com/pgsty/minio
  site: https://silo.pgsty.com
  siteZh: https://silo.pgsty.com/zh/
  version: RELEASE.2026-06
  license: AGPL-3.0
  stars: 1954
  lang: Go
  kind: OBJECT STORAGE
  kindZh: 对象存储
  desc: The MinIO fork maintained by PIGSTY — S3-compatible object storage with continued security updates, a restored console, and full release artifacts.
  descZh: PIGSTY 维护的 MinIO 分支 —— S3 兼容对象存储，持续安全更新、恢复的管理控制台与完整发行制品。
  install: "docker pull pgsty/minio"
  installZh: "docker pull pgsty/minio"

