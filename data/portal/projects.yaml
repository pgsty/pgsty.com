- key: pigsty
  use: Deploying and operating PostgreSQL on your own servers or cloud virtual machines.
  useZh: 在自有服务器或云虚拟机上部署与运维 PostgreSQL。
  name: Pigsty
  icon: fa-solid fa-database
  summary: A complete PostgreSQL deployment, with high availability, backup and recovery, monitoring, and extensions. Run it on infrastructure you control.
  summaryZh: 将 PostgreSQL、高可用、备份恢复、监控与扩展整合为完整的部署方案，运行在您自主掌控的基础设施上。
  features: [High availability, Backup & recovery, Monitoring]
  featuresZh: [高可用, 备份恢复, 监控告警]
  flagship: true
  repo: https://github.com/pgsty/pigsty
  site: https://pigsty.io/
  siteZh: https://pigsty.cc/
  version: v4.5.0
  license: Apache-2.0
  stars: 5660
  lang: Ansible
  kind: PG DISTRIBUTION
  kindZh: PG 发行版
  desc: A complete PostgreSQL distribution with automated deployment, high availability, monitoring, and extensions.
  descZh: 整合自动化部署、高可用、监控与扩展的 PG 发行版。
  install: "curl -fsSL https://repo.pigsty.io/get | bash"
  installZh: "curl -fsSL https://repo.pigsty.cc/get | bash"

- key: pig
  use: Preparing PostgreSQL environments and managing database extension packages.
  useZh: 准备 PostgreSQL 环境，管理数据库扩展软件包。
  name: PIG
  icon: fa-solid fa-terminal
  summary: Install PostgreSQL and extensions via system package managers.
  summaryZh: 通过命令行安装 PG 及其扩展，对接系统原生包管理器。
  repo: https://github.com/pgsty/pig
  site: https://pig.pgsty.com/
  siteZh: https://pig.pgsty.com/zh/
  version: v1.6.1
  license: Apache-2.0
  stars: 199
  lang: Go
  kind: PACKAGE MANAGER
  kindZh: 包管理器
  desc: A command-line package manager for installing PostgreSQL and its extensions across supported Linux distributions.
  descZh: 面向 PostgreSQL 及其扩展的命令行软件包管理器。
  install: "curl -fsSL https://repo.pigsty.io/pig | bash"
  installZh: "curl -fsSL https://repo.pigsty.cc/pig | bash"

- key: pg_exporter
  use: Collecting database metrics for Prometheus monitoring and Grafana dashboards.
  useZh: 采集数据库指标，用于 Prometheus 监控与仪表盘。
  name: PG Exporter
  icon: fa-solid fa-chart-line
  summary: Collect metrics from PostgreSQL and PgBouncer for Prometheus.
  summaryZh: 采集 PG 与连接池运行指标，为监控大盘提供详实数据。
  repo: https://github.com/pgsty/pg_exporter
  site: https://exp.pgsty.com/
  siteZh: https://exp.pgsty.com/zh/
  version: v1.4.1
  license: Apache-2.0
  stars: 358
  lang: Go
  kind: METRICS EXPORTER
  kindZh: 指标导出器
  desc: A Prometheus metrics exporter for PostgreSQL and PgBouncer, with declarative collector configuration.
  descZh: PostgreSQL 与 PgBouncer 生产指标导出器。
  install: "docker pull pgsty/pg_exporter"
  installZh: "docker pull pgsty/pg_exporter"

- key: silo
  use: Providing an S3-compatible storage endpoint on infrastructure you manage.
  useZh: 在自主管理的基础设施上提供兼容 S3 的存储接口。
  name: Silo
  icon: fa-solid fa-layer-group
  summary: S3-compatible object storage, maintained as a fork of MinIO. Store and manage your data with an open-source server, client, and console.
  summaryZh: 持续维护的 MinIO 分支，提供兼容 S3 的对象存储，以及配套的客户端与管理控制台，让存储同样掌握在自己手中。
  features: [S3 compatible, Management console, Self-hosted]
  featuresZh: [S3 兼容, 管理控制台, 自建部署]
  repo: https://github.com/pgsty/silo
  site: https://silo.pgsty.com/
  siteZh: https://silo.pgsty.com/zh/
  version: RELEASE.2026-09-16
  license: AGPL-3.0
  stars: 3565
  lang: Go
  kind: OBJECT STORAGE
  kindZh: 对象存储
  desc: An S3-compatible object storage server maintained as a MinIO fork, with a console and release packages.
  descZh: 持续维护的 MinIO 分支，兼容 S3 的对象存储服务。
  install: "docker pull pgsty/silo"
  installZh: "docker pull pgsty/silo"

- key: sow
  use: Publishing and maintaining Linux package repositories.
  useZh: 发布与维护 Linux 软件包仓库，实现自动化分发。
  name: SOW
  icon: fa-solid fa-box-archive
  summary: Build and publish private APT and YUM repositories.
  summaryZh: 构建与发布私有 APT/YUM 软件仓库，实现软件包自动化分发。
  repo: https://github.com/pgsty/sow
  site: https://sow.pgsty.com/
  siteZh: https://sow.pgsty.com/zh/
  version: v0.3.0
  license: Apache-2.0
  stars: 1
  lang: Go
  kind: REPO MANAGER
  kindZh: 仓库管理器
  desc: A repository manager for RPM and DEB packages, featuring repository indexing and incremental publishing.
  descZh: 面向 RPM 与 DEB 软件包的私有仓库管理器。
  install: "sow create ./packages"
  installZh: "sow create ./packages"

