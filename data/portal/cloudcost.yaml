# ============================================================
# /solutions/cloud-exit/ — 云成本数据集
# （三大件谱系 / 交互计算器 / 判词 / 案例 / 行业锚点 / 文选 / 来源）
#
# 数字规则（PRD §7.2）：每个数字必须可溯源。
#   · 算力与 RDS：作者公开成本分析（sources 1/2/4…），底稿为 RDS 成本
#     核算工作表 —— 阿里云华东挂牌价 2025-04 抓取，AWS us-east 按 7.24 折算
#   · 云盘：阿里云 ESSD 价格参考页 + AWS EBS 官方价格页（refs，2026-08-06 抓取）
#   · 对象存储：作者 S3 成本分析（source 8）
#   · 行业锚点：Pigsty 订阅与服务条款页（refs.svc，2026-08-06 抓取）
# 单位：数据库/算力 = ¥/vCPU·月；对象存储 = ¥/TB·月；云盘 = ¥/GB·月
# ============================================================

meta:
  captured: "2025-04"
