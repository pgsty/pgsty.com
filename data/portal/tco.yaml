# ============================================================
# /solutions/cloud-exit/ — 三年 TCO 对比表数据（PRD §7.2）
#
# 数字规则（严格执行）：
#   每个价格单元格必须同时给出 price / source（公开价目页 URL）/ date（抓取日期），
#   三者缺一 → 模板渲染为醒目的 TODO 占位。禁止无来源数字。
#
# 填数指引（TODO(user)）：
#   aws    — AWS Pricing Calculator：RDS for PostgreSQL，Multi-AZ，
#            3-year reserved（no upfront 或 all upfront，取一并注明），
#            含规格所列存储（gp3），us-east-1；填三年总额（USD）。
#   aliyun — 阿里云价格计算器：RDS PostgreSQL 高可用版（主备），
#            3 年包年包月，含 ESSD 存储，华东 1（杭州）；填三年总额（CNY）。
#   self   — 2 × 商用服务器整机报价（按规格向上取整）+ 3 年 Pigsty 订阅
#            （按实际节点数取档，见 data/portal/pricing.yaml）+ 托管电力估算；
#            硬件按 3 年直线折旧（保守口径，服务器常用 5 年以上）。
#
# price 为展示字符串（含货币符号），如 "$xx,xxx" / "¥xx 万"。
# ============================================================
